# Build workflow for McediaCore
#
# Builds all modules across multiple Minecraft versions and native platforms.
# Uses a discovery job to normalize the version/platform set from gradle.properties
# or workflow_dispatch input, then fans out into parallel matrix jobs.
#
# Job structure:
#   discover → non-versioned (api, player, decoder-ffmpeg)
#           → cn-platforms   (matrix: mc_version)
#           → core           (matrix: mc_version × native_platform)
#
# Non-versioned modules are rebuilt as project dependencies by each versioned
# job via Gradle's project-dependency resolution — no cross-job artifact passing.
name: Build

on:
  push:
    branches: [master, dev]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      mc_versions:
        description: 'Minecraft versions (comma-separated, e.g. 1.21.11 or 1.21.11,26.1)'
        default: '1.21.11'
        required: true
        type: string
      build_platforms:
        description: 'Native platforms (comma-separated, or "all")'
        default: 'all'
        required: true
        type: string
      create_release:
        description: 'Create a GitHub Release with the built artifacts'
        default: false
        type: boolean

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8'

jobs:
  # ── Discover ────────────────────────────────────────────────────────
  # Normalizes MC versions and native platforms into JSON arrays consumed
  # by downstream matrix jobs. For push/PR reads from gradle.properties;
  # for workflow_dispatch uses the user-supplied input.
  discover:
    runs-on: ubuntu-latest
    outputs:
      mc_versions: ${{ steps.set-mc.outputs.mc_versions }}
      platforms:   ${{ steps.set-platforms.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Minecraft versions
        id: set-mc
        run: |
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            INPUT='${{ github.event.inputs.mc_versions }}'
          else
            INPUT=$(grep '^supported_mc_versions' gradle.properties | cut -d= -f2-)
          fi
          JSON=$(echo "$INPUT" | tr ',' '\n' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | jq --raw-input --slurp --compact-output \
              'split("\n") | map(select(length > 0))')
          echo "mc_versions=$JSON" >> "$GITHUB_OUTPUT"
          echo "Resolved MC versions: $JSON"

      - name: Resolve native platforms
        id: set-platforms
        run: |
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ] \
             && [ '${{ github.event.inputs.build_platforms }}' != 'all' ]; then
            INPUT='${{ github.event.inputs.build_platforms }}'
          else
            INPUT=$(grep '^supported_native_platforms' gradle.properties | cut -d= -f2-)
          fi
          JSON=$(echo "$INPUT" | tr ',' '\n' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | jq --raw-input --slurp --compact-output \
              'split("\n") | map(select(length > 0))')
          echo "platforms=$JSON" >> "$GITHUB_OUTPUT"
          echo "Resolved platforms: $JSON"

  # ── Non-versioned modules ──────────────────────────────────────────
  # Pure Java libraries with no Minecraft dependency.
  # Runs tests — they are standard JUnit 5 and don't need GL/OpenAL.
  non-versioned:
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build non-versioned modules (with tests)
        run: |
          ./gradlew :mcedia-api:build \
                    :mcedia-player:build \
                    :mcedia-decoder-ffmpeg:build \
                    -Psupported_mc_versions=1.21.11

      - name: Upload non-versioned JARs
        uses: actions/upload-artifact@v4
        with:
          name: non-versioned-jars
          path: |
            mcedia-api/build/libs/*.jar
            mcedia-player/build/libs/*.jar
            mcedia-decoder-ffmpeg/build/libs/*.jar
          if-no-files-found: warn

  # ── Versioned: cn-platforms ─────────────────────────────────────────
  # Chinese platform integration mod. One build per MC version.
  # No native platform variants — does not bundle FFmpeg.
  # Runs tests (no GL/OpenAL dependency).
  cn-platforms:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mc_version: ${{ fromJSON(needs.discover.outputs.mc_versions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Java version for ${{ matrix.mc_version }}
        id: jdk
        run: |
          PROP="mcedia-cn-platforms/versions/${{ matrix.mc_version }}/gradle.properties"
          echo "java_version=$(grep '^java_version' "$PROP" | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.jdk.outputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.java_version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build cn-platforms for ${{ matrix.mc_version }}
        run: |
          ./gradlew :mcedia-cn-platforms-${{ matrix.mc_version }}:buildAndCollect \
                    -Psupported_mc_versions=${{ matrix.mc_version }}

      - name: Upload cn-platforms JAR (${{ matrix.mc_version }})
        uses: actions/upload-artifact@v4
        with:
          name: mcedia-cn-platforms-${{ matrix.mc_version }}
          path: build/libs/${{ matrix.mc_version }}/*.jar
          if-no-files-found: warn

  # ── Versioned: core (matrix: mc_version × native_platform) ──────────
  # Core mod that bundles FFmpeg native binaries. Each platform variant
  # selects a different JavaCPP Maven artifact — no cross-compilation.
  # Tests are skipped: they depend on Minecraft's rendering/audio
  # infrastructure (GL context, OpenAL) not available on CI runners.
  core:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mc_version: ${{ fromJSON(needs.discover.outputs.mc_versions) }}
        platform:   ${{ fromJSON(needs.discover.outputs.platforms) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Java version for ${{ matrix.mc_version }}
        id: jdk
        run: |
          PROP="mcedia-core/versions/${{ matrix.mc_version }}/gradle.properties"
          echo "java_version=$(grep '^java_version' "$PROP" | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.jdk.outputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.java_version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build core ${{ matrix.mc_version }} for ${{ matrix.platform }}
        run: |
          ./gradlew :mcedia-core-${{ matrix.mc_version }}:buildAndCollect \
                    -Psupported_mc_versions=${{ matrix.mc_version }} \
                    -PplatformName=${{ matrix.platform }} \
                    -x test

      - name: Upload core JAR (${{ matrix.mc_version }} ${{ matrix.platform }})
        uses: actions/upload-artifact@v4
        with:
          name: mcedia-core-${{ matrix.mc_version }}-${{ matrix.platform }}
          path: build/libs/${{ matrix.mc_version }}/*.jar
          if-no-files-found: error

  # ── Release ──────────────────────────────────────────────────────────
  # Creates a GitHub Release with all built JARs as assets.
  # Triggered by:
  #   - Push of a tag matching v* (e.g. v1.0.0, v1.0.0-rc1)
  #   - workflow_dispatch with create_release=true
  release:
    if: |
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    needs: [non-versioned, cn-platforms, core]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather JAR files
        run: |
          mkdir -p release-assets
          find artifacts -name '*.jar' -type f | while read jar; do
            echo "Collected: $jar"
            cp "$jar" release-assets/
          done
          echo "---"
          ls -lh release-assets/

      - name: Determine release tag and name
        id: tag
        run: |
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            # Use current version from gradle.properties
            VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "name=v${VERSION} (manual release)"
          else
            TAG=${GITHUB_REF_NAME}
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          body: |
            Automated build from commit ${{ github.sha }}.

            ## Modules

            - **mcedia-api** — API interfaces
            - **mcedia-player** — Media player engine
            - **mcedia-decoder-ffmpeg** — FFmpeg decoder via JavaCV
            - **mcedia-core** (per-platform) — Core Fabric mod with FFmpeg native binaries
            - **mcedia-cn-platforms** — Chinese streaming platform integration

            ## Native Platforms (mcedia-core)

            - windows-x86_64
            - linux-x86_64
            - linux-arm64
            - macosx-x86_64
            - macosx-arm64
          files: release-assets/*.jar
          fail_on_unmatched_files: true

      # ── Publish to Modrinth ────────────────────────────────────────────
      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_CORE_PROJECT_ID: ${{ secrets.MODRINTH_CORE_PROJECT_ID }}
          MODRINTH_CN_PLATFORMS_PROJECT_ID: ${{ secrets.MODRINTH_CN_PLATFORMS_PROJECT_ID }}
        run: |
          set -euo pipefail

          publish_version() {
            local jar="$1"
            local project_id="$2"
            local game_versions_json="$3"
            local version_number="$4"
            local display_name="$5"
            local loaders_json="$6"
            local deps_json="$7"

            local data
            data=$(jq -n \
              --arg name "$display_name" \
              --arg version_number "$version_number" \
              --argjson game_versions "$game_versions_json" \
              --arg version_type "release" \
              --argjson loaders "$loaders_json" \
              --argjson dependencies "$deps_json" \
              --arg project_id "$project_id" \
              --arg changelog "Automated build from commit ${GITHUB_SHA:0:7}." \
              '{
                name: $name,
                version_number: $version_number,
                changelog: $changelog,
                game_versions: $game_versions,
                version_type: $version_type,
                loaders: $loaders,
                dependencies: $dependencies,
                project_id: $project_id,
                featured: false,
                file_parts: ["file"],
                primary_file: "file"
              }')

            echo "  → ${display_name} (${game_versions_json})"
            response=$(curl -sL -w "\n%{http_code}" -X POST "https://api.modrinth.com/v2/version" \
              -H "Authorization: $MODRINTH_TOKEN" \
              -F "data=$data" \
              -F "file=@${jar}")
            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | head -n -1)

            if [ "$http_code" = "200" ]; then
              echo "  ✓ Success"
            else
              echo "  ✗ Failed (HTTP $http_code): $(echo "$body" | head -c 200)"
            fi
          }

          # === mcedia-core (windows-x86_64 only) ===
          if [ -n "${MODRINTH_TOKEN:-}" ] && [ -n "${MODRINTH_CORE_PROJECT_ID:-}" ]; then
            echo "::group::Publish mcedia-core to Modrinth"
            find release-assets -maxdepth 1 -name 'mcedia_core-*.jar' -print0 | while IFS= read -r -d '' jar; do
              filename=$(basename "$jar")
              [[ "$filename" == *-sources-* ]] && continue

              # Strip .jar then +build<ts> suffix
              name="${filename%.jar}"
              name="${name%+build*}"

              # name: mcedia_core-<modver>+<mcver>.<platform>
              rest="${name#mcedia_core-}"
              modver="${rest%%+*}"
              rest2="${rest#*+}"
              mcver="${rest2%.*}"       # "1.21.11" from "1.21.11.windows-x86_64"
              platform="${rest2##*.}"   # "windows-x86_64"

              # Only publish windows-x86_64
              [ "$platform" != "windows-x86_64" ] && continue

              version_number="${modver}+${mcver}"
              display_name="mcedia-core ${modver}+${mcver}"

              # Build game versions list (expand 26.1 → 26.1,26.1.1,26.1.2)
              case "$mcver" in
                26.1) gv='["26.1","26.1.1","26.1.2"]' ;;
                *)    gv="[\"${mcver}\"]" ;;
              esac

              publish_version \
                "$jar" \
                "$MODRINTH_CORE_PROJECT_ID" \
                "$gv" \
                "$version_number" \
                "$display_name" \
                '["fabric"]' \
                '[]' || true
            done
            echo "::endgroup::"
          else
            echo "::notice::Skip Modrinth core publish: MODRINTH_TOKEN or MODRINTH_CORE_PROJECT_ID not set"
          fi

          # === mcedia-cn-platforms (no platform variants) ===
          if [ -n "${MODRINTH_TOKEN:-}" ] && [ -n "${MODRINTH_CN_PLATFORMS_PROJECT_ID:-}" ]; then
            echo "::group::Publish mcedia-cn-platforms to Modrinth"
            find release-assets -maxdepth 1 -name 'mcedia_cn_platforms-*.jar' -print0 | while IFS= read -r -d '' jar; do
              filename=$(basename "$jar")
              [[ "$filename" == *-sources-* ]] && continue

              # Strip .jar then +build<ts> suffix
              name="${filename%.jar}"
              name="${name%+build*}"

              # name: mcedia_cn_platforms-<modver>+<mcver>.<platform>
              rest="${name#mcedia_cn_platforms-}"
              modver="${rest%%+*}"
              rest2="${rest#*+}"
              mcver="${rest2%.*}"       # "1.21.11" from "1.21.11.universal"
              version_number="${modver}+${mcver}"
              display_name="mcedia-cn-platforms ${modver}+${mcver}"

              # Build game versions list (expand 26.1 → 26.1,26.1.1,26.1.2)
              case "$mcver" in
                26.1) gv='["26.1","26.1.1","26.1.2"]' ;;
                *)    gv="[\"${mcver}\"]" ;;
              esac

              # Depend on mcedia-core
              deps="[]"
              if [ -n "${MODRINTH_CORE_PROJECT_ID:-}" ]; then
                deps="[{\"project_id\":\"${MODRINTH_CORE_PROJECT_ID}\",\"dependency_type\":\"required\"}]"
              fi

              publish_version \
                "$jar" \
                "$MODRINTH_CN_PLATFORMS_PROJECT_ID" \
                "$gv" \
                "$version_number" \
                "$display_name" \
                '["fabric"]' \
                "$deps" || true
            done
            echo "::endgroup::"
          else
            echo "::notice::Skip Modrinth cn-platforms publish: MODRINTH_TOKEN or MODRINTH_CN_PLATFORMS_PROJECT_ID not set"
          fi
